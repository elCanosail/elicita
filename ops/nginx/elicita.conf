server {
    server_name elicita.es www.elicita.es;

    # Security headers (complementan los de Cloudflare: HSTS/X-Frame/Referrer ya los pone CF)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP ajustada para Astro + Clerk + MCP — relajada para no romper assets/hydration
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://clerk.elicita.es https://analytics.elicita.es; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://clerk.elicita.es https://*.clerk.accounts.dev https://clerk.accounts.dev wss:; frame-src 'self' https://clerk.elicita.es https://*.clerk.accounts.dev https://clerk.accounts.dev; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Bot protection
    include /etc/nginx/snippets/bot-protection.conf;

    # Rate limiting global
    limit_req zone=general_limit burst=20 nodelay;

    # Rate limiting estricto para /sign-in y auth
    location = /sign-in {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://elicita_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        include /etc/nginx/snippets/proxy-resilience.conf;
    }

    # Rate limiting para API endpoints (DuckDB-heavy)
    # MCP server + OAuth endpoints (stateless, spec 2026-07-28)
    location = /mcp/callback {
        proxy_pass http://127.0.0.1:4326;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:4326;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # OAuth 2.0 endpoints for MCP
    location = /authorize {
        proxy_pass http://127.0.0.1:4326;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /token {
        proxy_pass http://127.0.0.1:4326;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /register {
        proxy_pass http://127.0.0.1:4326;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:4326;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://elicita_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        include /etc/nginx/snippets/proxy-resilience.conf;
    }

    location / {
        proxy_pass http://elicita_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        include /etc/nginx/snippets/proxy-resilience.conf;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/elicita.es/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/elicita.es/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.elicita.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = elicita.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name elicita.es www.elicita.es;
    return 404; # managed by Certbot




}