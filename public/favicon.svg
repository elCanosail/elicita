<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2540"/>
      <stop offset="100%" style="stop-color:#1b3a5c"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="20" ry="20" fill="url(#bg)"/>
  
  <!-- Stylized "e" -->
  <text x="50" y="72" 
        text-anchor="middle" 
        font-family="Space Mono, monospace" 
        font-size="65" 
        font-weight="600"
        fill="#d1f0de">e</text>
  
  <!-- Subtle accent dot -->
  <circle cx="72" cy="28" r="6" fill="#27864f"/>
</svg>
